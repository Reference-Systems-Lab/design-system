version: 2

# Every ecosystem waits 7 days after a release before proposing it, as npm's min-release-age does, and
# groups its routine updates into one pull request.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]

  # The whole workspace: one lockfile at the root covers every package and app.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      vue-tooling:
        patterns: ["vue", "vue-tsc", "@vitejs/*", "vite"]
      lint:
        patterns:
          ["eslint", "@eslint/*", "eslint-*", "typescript-eslint", "vue-eslint-parser", "prettier"]
      dependencies:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # TypeScript stays on 6.0 (commerce#3 DE-3; ADR 0001): TypeScript 7 ships no compiler API, which
      # typescript-eslint and vue-tsc need. Lift this when they support 7.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
