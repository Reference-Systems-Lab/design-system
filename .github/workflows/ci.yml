name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  build:
    name: Build, lint, test
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Format and root lint
        run: npm run lint:root

      - name: Build, lint, type-check, test and check the packages
        run: npx turbo run build lint typecheck test check:package

  fixture:
    name: Consumer fixture
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Install the packed packages in a clean consumer and run every config
        run: npm run fixture

  changeset:
    name: Changeset
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # changeset status compares with the base branch

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: A changed package has a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # A version pull request (npm run version-packages) consumes the changesets it releases: it
          # deletes them and bumps package versions, instead of adding a changeset.
          deleted=$(git diff --name-only --diff-filter=D "origin/$BASE_REF" -- '.changeset/*.md')
          bumped=$(git diff "origin/$BASE_REF" -- 'packages/*/package.json' | grep -c '^+  "version":' || true)
          if [ -n "$deleted" ] && [ "$bumped" -gt 0 ]; then
            echo "This pull request releases changesets (a version PR); nothing to check."
            exit 0
          fi
          npx changeset status --since="origin/$BASE_REF"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Review the dependencies this pull request adds
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
